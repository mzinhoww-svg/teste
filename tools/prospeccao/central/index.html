<title>Reiners · Central de disparo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap">
<style>
  /* Layout: placar fixo com seletor de funil (aquecimento / pós-venda) e uma coluna de cards; cada card mostra o trilho do seu funil. */
  :root {
    --navy: #14243E;
    --creme: #FAF7F2;
    --papel: #FFFFFF;
    --pergaminho: #F0EBE1;
    --linha: #E2DACB;
    --suave: #5E5549;
    --ouro: #9A7B35;
    --ouro-texto: #6E5726;
    --ouro-fundo: #F3EAD3;
    --ok: #1F6B45;
    --ok-fundo: #E3F0E8;
    --alerta: #9B2C2C;
    --alerta-fundo: #F7E4E1;
    --btn: #14243E;
    --btn-texto: #FAF7F2;
    --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --sans: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --navy: #F0EBE1; --creme: #0E1726; --papel: #16223A; --pergaminho: #1E2C47; --linha: #2B3B5A;
      --suave: #A9B2C3; --ouro: #C4A15A; --ouro-texto: #E0C27F; --ouro-fundo: #33291A;
      --ok: #85D3A6; --ok-fundo: #173325; --alerta: #F2A49A; --alerta-fundo: #3B1D1A;
      --btn: #E8D9B5; --btn-texto: #14243E;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --navy: #F0EBE1; --creme: #0E1726; --papel: #16223A; --pergaminho: #1E2C47; --linha: #2B3B5A;
    --suave: #A9B2C3; --ouro: #C4A15A; --ouro-texto: #E0C27F; --ouro-fundo: #33291A;
    --ok: #85D3A6; --ok-fundo: #173325; --alerta: #F2A49A; --alerta-fundo: #3B1D1A;
    --btn: #E8D9B5; --btn-texto: #14243E;
  }

  * { box-sizing: border-box; }
  body { background: var(--creme); color: var(--navy); font: 15px/1.5 var(--sans); }
  .wrap { max-width: 740px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
  button, select, input, a.btn { font: inherit; }
  :focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }

  header.topo {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--creme); padding-block: 14px 12px; border-bottom: 1px solid var(--linha);
    display: grid; gap: 10px;
  }
  .marca { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .marca h1 { margin: 0; font: 600 30px/1 var(--display); letter-spacing: 0.01em; }
  .marca h1 small { font: 500 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ouro-texto); margin-left: 8px; }
  .conexao { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--suave); }
  .conexao.on { color: var(--ok); }

  .funis { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--navy); border-radius: 8px; overflow: hidden; }
  .funis button { border: 0; background: var(--papel); color: var(--navy); padding: 8px 10px; cursor: pointer;
                  font-weight: 500; display: flex; justify-content: center; gap: 6px; align-items: baseline; }
  .funis button + button { border-left: 1px solid var(--navy); }
  .funis button[aria-pressed="true"] { background: var(--navy); color: var(--creme); }
  .funis .n { font: 500 12px var(--mono); opacity: .75; }

  .placar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; font-variant-numeric: tabular-nums; }
  .placar div { display: grid; gap: 2px; }
  .placar b { font: 600 26px/1 var(--display); }
  .placar span { font: 500 10.5px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--suave); }
  .barra { height: 3px; background: var(--linha); border-radius: 2px; overflow: hidden; }
  .barra i { display: block; height: 100%; width: 100%; background: var(--ouro); transform: scaleX(0); transform-origin: left; transition: transform .3s; }
  @media (prefers-reduced-motion: reduce) { .barra i { transition: none; } }

  .aviso { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--alerta-fundo); color: var(--alerta); font-size: 14px; }

  .filtros { display: grid; gap: 8px; margin-block: 14px; }
  .abas { display: flex; gap: 6px; flex-wrap: wrap; }
  .abas button { border: 1px solid var(--linha); background: var(--papel); color: var(--navy);
                 border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
  .abas button[aria-pressed="true"] { background: var(--navy); color: var(--creme); border-color: var(--navy); }
  .abas .n { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 4px; }
  .selects { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; align-items: end; }
  .selects.dois { grid-template-columns: repeat(2, minmax(0, 1fr)) auto; }
  label.campo { display: grid; gap: 3px; font: 500 10.5px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--suave); }
  label.campo select, label.campo input { width: 100%; padding: 7px 8px; border: 1px solid var(--linha); border-radius: 8px;
                    background: var(--papel); color: var(--navy); font: 14px var(--sans); letter-spacing: 0; text-transform: none; min-width: 0; }

  #lista { display: grid; gap: 12px; }
  .card { background: var(--papel); border: 1px solid var(--linha); border-radius: 10px; padding: 14px;
          display: grid; gap: 10px; min-width: 0; }
  .card.teste { border-style: dashed; }
  .card.apagado { opacity: .62; }
  .card.form { border-color: var(--ouro); }
  .card.form h2 { margin: 0; font: 600 22px/1.2 var(--display); }
  .grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .cab { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
  .cab > div { min-width: 0; }
  .cab h2 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.25; text-wrap: balance; }
  .meta { font: 12px/1.4 var(--mono); color: var(--suave); margin-top: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--pergaminho); white-space: nowrap; }
  .chip.flag { background: var(--ouro-fundo); color: var(--ouro-texto); font-weight: 500; }
  .estado { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
            padding: 5px 8px; border-radius: 6px; white-space: nowrap; }
  .estado.hoje { background: var(--ouro-fundo); color: var(--ouro-texto); }
  .estado.aguardando, .estado.andamento { background: var(--pergaminho); color: var(--suave); }
  .estado.respondeu, .estado.fechou, .estado.concluido { background: var(--ok-fundo); color: var(--ok); }
  .estado.encerrado, .estado.sair, .estado.pausado { background: var(--pergaminho); color: var(--alerta); }

  /* Trilho da prospecção: visita, diagnóstico, piloto */
  .trilho { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .passo { border-top: 3px solid var(--linha); padding-top: 6px; display: grid; gap: 1px; min-width: 0; }
  .passo b { font: 500 10.5px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--suave); }
  .passo span { font-size: 12.5px; color: var(--suave); font-variant-numeric: tabular-nums; }
  .passo.feito { border-color: var(--ouro); }
  .passo.feito b { color: var(--ouro-texto); }
  .passo.agora { border-color: var(--navy); }
  .passo.agora b, .passo.agora span { color: var(--navy); }

  /* Trilho do pós-venda: sete segmentos e a etapa atual por extenso */
  .esteira { display: grid; gap: 6px; }
  .segs { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .segs i { height: 4px; border-radius: 2px; background: var(--linha); }
  .segs i.feito { background: var(--ouro); }
  .segs i.agora { background: var(--navy); }
  .esteira .rotulo { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; }
  .esteira .rotulo b { font: 500 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
  .esteira .rotulo span { color: var(--suave); font-variant-numeric: tabular-nums; }

  .frase { margin: 0; font: 500 20px/1.3 var(--display); }

  /* Foto do cenário que vai junto do toque 1 */
  .foto { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; align-items: start;
          background: var(--creme); border-radius: 8px; padding: 8px; margin: 0; }
  .foto a.img { display: block; aspect-ratio: 2 / 3; border-radius: 6px; overflow: hidden; background: var(--pergaminho); }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; max-width: 100%; }
  .foto figcaption { display: grid; gap: 8px; min-width: 0; font-size: 13px; color: var(--suave); }
  .foto figcaption b { font: 500 11px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--navy); }
  .foto ol { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
  details summary { cursor: pointer; font-size: 13px; color: var(--suave); }
  .msg { white-space: pre-wrap; font-size: 14px; background: var(--creme); border-radius: 8px;
         padding: 10px 12px; margin: 8px 0 0; overflow-wrap: anywhere; }
  .dica { font-size: 13px; color: var(--ouro-texto); background: var(--ouro-fundo); border-radius: 8px; padding: 8px 10px; }
  .destino { font: 13px var(--mono); color: var(--suave); overflow-wrap: anywhere; user-select: all; }
  .acoes { display: flex; flex-wrap: wrap; gap: 6px; align-items: end; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px;
         padding: 8px 14px; border-radius: 8px; border: 1px solid var(--linha); background: var(--papel);
         color: var(--navy); text-decoration: none; cursor: pointer; font-size: 14px; }
  .btn.principal { background: var(--btn); color: var(--btn-texto); border-color: var(--btn); font-weight: 500; }
  .btn.ok { color: var(--ok); }
  .btn.sair { color: var(--alerta); margin-left: auto; }
  .btn[aria-disabled="true"], .btn:disabled { opacity: .45; pointer-events: none; }
  .erro { color: var(--alerta); font-size: 13px; }
  .vazio { text-align: center; color: var(--suave); padding: 40px 12px; }
  .vazio b { display: block; font: 600 24px/1.2 var(--display); color: var(--navy); margin-bottom: 6px; }
  #toast { position: fixed; left: 50%; transform: translateX(-50%);
           bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--navy); color: var(--creme);
           padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 10; }
  @media (max-width: 460px) {
    .placar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .selects, .selects.dois { grid-template-columns: 1fr 1fr; }
    .selects.dois .btn { grid-column: 1 / -1; }
    .grade { grid-template-columns: 1fr; }
    .btn.sair { margin-left: 0; }
  }
</style>

<div class="wrap">
  <header class="topo">
    <div class="marca">
      <h1>Reiners Media<small>Central de disparo</small></h1>
      <span id="conexao" class="conexao">Conectando</span>
    </div>
    <div class="funis" role="group" aria-label="Funil">
      <button type="button" id="f-aq" data-funil="aq" aria-pressed="true">Aquecimento <span class="n" id="n-aq"></span></button>
      <button type="button" id="f-pv" data-funil="pv" aria-pressed="false">Pós-venda <span class="n" id="n-pv"></span></button>
    </div>
    <div class="placar">
      <div><b id="p1">0</b><span id="p1l">Para hoje</span></div>
      <div><b id="p2">0</b><span id="p2l">Toques hoje</span></div>
      <div><b id="p3">0</b><span id="p3l">Em cadência</span></div>
      <div><b id="p4">0</b><span id="p4l">Responderam</span></div>
    </div>
    <div class="barra" aria-hidden="true"><i id="barra"></i></div>
  </header>

  <div id="aviso" class="aviso" hidden></div>

  <nav class="filtros" aria-label="Filtros">
    <div class="abas" id="abas"></div>
    <div class="selects" id="sel-aq">
      <label class="campo" for="f-segmento">Segmento<select id="f-segmento"><option value="">Todos</option></select></label>
      <label class="campo" for="f-faixa">Faixa<select id="f-faixa"><option value="">Todas</option></select></label>
      <label class="campo" for="f-canal">Canal<select id="f-canal"><option value="">Todos</option></select></label>
    </div>
    <div class="selects dois" id="sel-pv" hidden>
      <label class="campo" for="f-etapa">Etapa<select id="f-etapa"><option value="">Todas</option></select></label>
      <label class="campo" for="f-produto">Produto<select id="f-produto"><option value="">Todos</option></select></label>
      <button type="button" class="btn principal" id="novo-cliente">Novo cliente</button>
    </div>
  </nav>

  <main id="lista" aria-live="polite">
    <div class="vazio"><b>Carregando</b>Conectando ao banco da central.</div>
  </main>
</div>
<div id="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";
  var NOMES_TOQUE = { 1: "Visita", 2: "Diagnóstico", 3: "Piloto" };
  var DIA = 86400000;
  var DIAS_SEMANA = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
  var ABAS = {
    aq: [["hoje", "Para hoje"], ["aguardando", "Aguardando"], ["respondeu", "Responderam"], ["fechou", "Fecharam"],
         ["encerrado", "Sem resposta"], ["sair", "Saíram"], ["todos", "Todos"]],
    pv: [["hoje", "Para hoje"], ["andamento", "Em andamento"], ["pausado", "Pausados"], ["concluido", "Concluídos"], ["todos", "Todos"]]
  };
  var estado = {
    funil: "aq",
    leads: {},
    clientes: {},
    meta: { metaDiaria: 20, esperaDias: { "1": 0, "2": 4, "3": 6 } },
    pv: null,
    fotos: null,
    downloads: null,
    db: null,
    podeMarcar: false,
    gravando: {},
    carregado: { leads: false, clientes: false },
    fechando: null,
    novoCliente: false,
    filtro: {
      aq: { grupo: "hoje", segmento: "", faixa: "", canal: "" },
      pv: { grupo: "hoje", etapa: "", produto: "" }
    }
  };
  var $ = function (id) { return document.getElementById(id); };

  // ---------- utilidades ----------
  function el(tag, attrs, filhos) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else if (k === "value") n.value = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
    });
    (filhos || []).forEach(function (f) { if (f) n.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
    return n;
  }
  function inicioDoDia(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function hoje() { return inicioDoDia(new Date()); }
  function mesmoDia(iso, ref) { return iso && inicioDoDia(iso).getTime() === inicioDoDia(ref).getTime(); }
  function dataCurta(d) {
    var x = new Date(d);
    if (isNaN(x)) return "";
    return x.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
  }
  // "2026-10-09T14:00" -> "quinta, 09/10, às 14h"
  function quando(valor) {
    if (!valor) return "";
    var d = new Date(valor);
    if (isNaN(d)) return "";
    var h = d.getHours() + "h" + (d.getMinutes() ? String(d.getMinutes()).padStart(2, "0") : "");
    return DIAS_SEMANA[d.getDay()] + ", " + dataCurta(d) + ", às " + h;
  }
  var toastTimer;
  function toast(txt) {
    var t = $("toast");
    t.textContent = txt; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2400);
  }
  function copiar(texto, rotulo) {
    function reserva() {
      var ta = el("textarea", { readonly: "", "aria-hidden": "true" });
      ta.value = texto;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? rotulo + " copiado" : "Não deu para copiar. Abra a mensagem e selecione o texto.");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(function () { toast(rotulo + " copiado"); }, reserva);
    } else { reserva(); }
  }
  function waLink(tel, texto) { return "https://wa.me/" + tel + "?text=" + encodeURIComponent(texto); }
  function mailto(email, assunto, corpo) {
    return "mailto:" + encodeURIComponent(email || "") + "?subject=" + encodeURIComponent(assunto || "") +
      "&body=" + encodeURIComponent(corpo || "");
  }
  function limparTelefone(v) {
    var d = String(v || "").replace(/\D/g, "").replace(/^0+/, "");
    if (d.length === 10 || d.length === 11) d = "55" + d;
    return /^55\d{10,11}$/.test(d) ? d : "";
  }
  function preencherSelect(id, valores) {
    var s = $(id), atual = s.value, chave = valores.join("|");
    if (s.dataset.chave === chave) return;
    s.dataset.chave = chave;
    while (s.options.length > 1) s.remove(1);
    valores.forEach(function (v) { s.add(new Option(v, v)); });
    s.value = valores.indexOf(atual) >= 0 ? atual : "";
  }

  // ---------- escrita ----------
  function falhou(e) {
    var code = e && e.code;
    if (code === "revoked" || code === "not_granted" || code === "capability_disabled" || code === "capability_removed") {
      desligar("A conexão com o banco caiu. Copiar e abrir mensagens continua funcionando; a marcação foi desativada.");
    } else if (code === "invalid_argument") {
      desligar("Sua conta pode ver a central, mas não pode marcar envios. Copiar e abrir mensagens continua funcionando.");
    } else if (code === "quota_exceeded") {
      toast("O banco da central está cheio. Avise o Claude para liberar espaço.");
    } else {
      toast("Não foi possível salvar. Tente de novo em instantes.");
    }
  }
  function gravar(caminho, dados, msg, criar) {
    if (!estado.podeMarcar || estado.gravando[caminho]) return Promise.resolve(false);
    estado.gravando[caminho] = true;
    render();
    var ref = estado.db.doc(caminho);
    return (criar ? ref.set(dados) : ref.update(dados)).then(function () { if (msg) toast(msg); return true; },
      function (e) { falhou(e); return false; })
      .then(function (ok) { delete estado.gravando[caminho]; render(); return ok; });
  }
  function desligar(msg) {
    estado.podeMarcar = false;
    $("aviso").textContent = msg;
    $("aviso").hidden = false;
    $("conexao").className = "conexao";
    $("conexao").textContent = "Sem banco";
    render();
  }

  // ================= AQUECIMENTO =================
  function etapa(l) { return Number(l.etapa) || 0; }
  function espera(n) { var e = estado.meta.esperaDias || {}; return Number(e[String(n)]) || 0; }
  function vencimento(l) {
    var e = etapa(l);
    if (e >= 3) return null;
    if (e === 0) return inicioDoDia(new Date(0));
    var ultimo = l["enviado" + e];
    if (!ultimo) return inicioDoDia(new Date(0));
    return new Date(inicioDoDia(ultimo).getTime() + espera(e + 1) * DIA);
  }
  function grupo(l) {
    if (l.situacao === "fechou") return "fechou";
    if (l.situacao === "respondeu") return "respondeu";
    if (l.situacao === "sair") return "sair";
    if (etapa(l) >= 3) return "encerrado";
    var v = vencimento(l);
    return v && v.getTime() <= hoje().getTime() ? "hoje" : "aguardando";
  }
  function toque(l, n) { return (l.toques || []).filter(function (t) { return Number(t.n) === n; })[0] || {}; }

  function marcarToque(l, n) {
    var dados = { etapa: n };
    dados["enviado" + n] = new Date().toISOString();
    gravar("leads/" + l.id, dados, "Toque " + n + " marcado como enviado");
  }
  function desfazerToque(l) {
    var e = etapa(l);
    if (e < 1) return;
    var dados = { etapa: e - 1 };
    dados["enviado" + e] = null;
    gravar("leads/" + l.id, dados, "Toque " + e + " desfeito");
  }
  function situacao(l, s, msg) { gravar("leads/" + l.id, { situacao: s }, msg); }

  function fecharNegocio(l, produto) {
    var cliente = {

        onclick: function () { gravar(caminho, { situacao: "pausado" }, "Cliente pausado"); } }, ["Pausar"]));
    }
    corpo.push(el("div", { class: "acoes" }, acoes));
    return el("article", { class: "card" + (g === "pausado" ? " apagado" : "") }, corpo);
  }

  function formNovoCliente() {
    var produtos = Object.keys((estado.pv && estado.pv.produtos) || { "Outro": 1 });
    var campos = {
      nome: el("input", { id: "nc-nome", autocomplete: "organization", placeholder: "Ex.: Clínica Exemplo" }),
      saudacao: el("input", { id: "nc-saudacao", placeholder: "Ex.: Dra. Lara ou pessoal da Clínica Exemplo" }),
      telefone: el("input", { id: "nc-telefone", inputmode: "tel", placeholder: "(65) 99999-0000" }),
      email: el("input", { id: "nc-email", type: "email", placeholder: "contato@empresa.com.br" }),
      produto: el("select", { id: "nc-produto" }, produtos.map(function (p) { return el("option", { value: p, text: p }); }))
    };
    var erro = el("p", { class: "erro", hidden: "" });
    function campo(rotulo, k) { return el("label", { class: "campo", for: campos[k].id }, [rotulo, campos[k]]); }
    function salvar() {
      var nome = campos.nome.value.trim(), saudacao = campos.saudacao.value.trim();
      var tel = campos.telefone.value.trim() ? limparTelefone(campos.telefone.value) : "";
      var email = campos.email.value.trim();
      var msg = !nome ? "Preencha o nome do cliente." : !saudacao ? "Preencha como a Letícia chama o cliente." :
        (campos.telefone.value.trim() && !tel) ? "O WhatsApp precisa ter DDD, como (65) 99999-0000." :
        (!tel && !email) ? "Informe um WhatsApp ou um e-mail." : "";
      if (msg) { erro.textContent = msg; erro.hidden = false; return; }
      var id = "C" + Date.now().toString(36).toUpperCase();
      gravar("clientes/" + id, {
        nome: nome, saudacao: saudacao, telefone: tel, email: email, produto: campos.produto.value,
        origem: "Cadastro manual", leadId: null, segmento: "", etapa: 1, situacao: "ativo",
        criadoEm: new Date().toISOString(), dataKickoff: null, dataGravacao: null
      }, "Cliente cadastrado: boas-vindas para hoje", true).then(function (ok) {
        if (ok) { estado.novoCliente = false; render(); }
      });
    }
    return el("article", { class: "card form" }, [
      el("h2", { text: "Novo cliente" }),
      el("div", { class: "grade" }, [campo("Nome", "nome"), campo("Saudação", "saudacao"),
        campo("WhatsApp", "telefone"), campo("E-mail", "email"), campo("Produto contratado", "produto")]),
      erro,
      el("div", { class: "acoes" }, [
        el("button", { type: "button", class: "btn principal", disabled: !estado.podeMarcar, onclick: salvar }, ["Cadastrar e começar"]),
        el("button", { type: "button", class: "btn", onclick: function () { estado.novoCliente = false; render(); } }, ["Cancelar"])
      ])
    ]);
  }

  function ordenarClientes(a, b) {
    var va = vencimentoPV(a), vb = vencimentoPV(b);
    var ta = va ? va.getTime() : -1, tb = vb ? vb.getTime() : -1;
    if (ta !== tb) return ta - tb;
    return String(a.criadoEm || "").localeCompare(String(b.criadoEm || ""));
  }

  function renderPV() {
    var todos = Object.keys(estado.clientes).map(function (k) { return estado.clientes[k]; }).sort(ordenarClientes);
    var cont = { hoje: 0, andamento: 0, pausado: 0, concluido: 0, todos: todos.length };
    var limite = hoje().getTime() + 8 * DIA, gravacoes = 0;
    todos.forEach(function (c) {
      var g = grupoPV(c);
      cont[g]++;
      if (c.dataGravacao && g !== "concluido" && g !== "pausado") {
        var t = new Date(c.dataGravacao).getTime();
        if (t >= hoje().getTime() && t < limite) gravacoes++;
      }
    });
    placar([cont.hoje, "Para hoje"], [cont.hoje + cont.andamento, "Clientes ativos"], [gravacoes, "Gravações em 7 dias"],
      [cont.concluido, "Concluídos"], null);
    abas(cont);
    var etapas = etapasPV().map(function (e) { return e.n + " · " + e.nome; });
    preencherSelect("f-etapa", etapas);
    var prods = {};
    todos.forEach(function (c) { if (c.produto) prods[c.produto] = 1; });
    preencherSelect("f-produto", Object.keys(prods).sort());

    var f = estado.filtro.pv;
    var visiveis = todos.filter(function (c) {
      if (f.grupo !== "todos" && grupoPV(c) !== f.grupo) return false;
      if (f.etapa && (etapaPV(c) + " · " + (defEtapa(etapaPV(c)) || {}).nome) !== f.etapa) return false;
      if (f.produto && c.produto !== f.produto) return false;
      return true;
    });
    var alvo = $("lista");
    alvo.textContent = "";
    if (!estado.carregado.clientes) return carregando(alvo);
    if (!estado.pv) {
      return vazio(alvo, "Faltam os textos do pós-venda", "Peça ao Claude para semear config/posvenda no banco da central.");
    }
    if (estado.novoCliente) alvo.appendChild(formNovoCliente());
    visiveis.forEach(function (c) { alvo.appendChild(cardCliente(c)); });
    if (!todos.length) {
      vazio(alvo, "Nenhum cliente no pós-venda", "Use Fechou negócio num lead do aquecimento ou Novo cliente para quem já comprou.");
    } else if (!visiveis.length) {
      if (f.grupo === "hoje") vazio(alvo, "Nada para hoje", "As próximas etapas aparecem em Em andamento.");
      else vazio(alvo, "Nada neste filtro", "Troque a aba ou limpe os filtros.");
    }
  }

  // ================= comum =================
  function placar(a, b, c, d, progresso) {
    [a, b, c, d].forEach(function (x, i) { $("p" + (i + 1)).textContent = x[0]; $("p" + (i + 1) + "l").textContent = x[1]; });
    $("barra").style.transform = "scaleX(" + (progresso == null ? 0 : Math.min(1, progresso)) + ")";
    $("barra").parentNode.hidden = progresso == null;
  }
  function abas(cont) {
    var f = estado.filtro[estado.funil], nav = $("abas");
    var chave = estado.funil;
    if (nav.dataset.funil !== chave) {
      nav.dataset.funil = chave;
      nav.textContent = "";
      ABAS[chave].forEach(function (a) {
        nav.appendChild(el("button", { type: "button", "data-grupo": a[0] }, [a[1], el("span", { class: "n" })]));
      });
    }
    Array.prototype.forEach.call(nav.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.grupo === f.grupo));
      b.querySelector(".n").textContent = cont[b.dataset.grupo];
    });
  }
  function carregando(alvo) {
    alvo.appendChild(el("div", { class: "vazio" }, [el("b", { text: "Carregando" }), "Conectando ao banco da central."]));
  }
  function vazio(alvo, titulo, texto) {
    alvo.appendChild(el("div", { class: "vazio" }, [el("b", { text: titulo }), texto]));
  }
  function render() {
    var pv = estado.funil === "pv";
    $("f-aq").setAttribute("aria-pressed", String(!pv));
    $("f-pv").setAttribute("aria-pressed", String(pv));
    $("sel-aq").hidden = pv;
    $("sel-pv").hidden = !pv;
    $("novo-cliente").disabled = !estado.podeMarcar || !estado.pv;
    var leads = Object.keys(estado.leads).filter(function (k) { return k !== "TESTE"; }).map(function (k) { return estado.leads[k]; });
    var clientes = Object.keys(estado.clientes).map(function (k) { return estado.clientes[k]; });
    $("n-aq").textContent = leads.filter(function (l) { return grupo(l) === "hoje"; }).length || "";
    $("n-pv").textContent = estado.pv ? (clientes.filter(function (c) { return grupoPV(c) === "hoje"; }).length || "") : "";
    if (pv) renderPV(); else renderAQ();
  }
  function trocarFunil(f) {
    estado.funil = f;
    estado.fechando = null;
    try { localStorage.setItem("central-funil", f); } catch (e) { /* sem armazenamento: tudo bem */ }
    render();
    window.scrollTo(0, 0);
  }

  // ---------- eventos ----------
  $("f-aq").addEventListener("click", function () { trocarFunil("aq"); });
  $("f-pv").addEventListener("click", function () { trocarFunil("pv"); });
  $("abas").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    estado.filtro[estado.funil].grupo = b.dataset.grupo;
    render();
  });
  ["segmento", "faixa", "canal"].forEach(function (k) {
    $("f-" + k).addEventListener("change", function (e) { estado.filtro.aq[k] = e.target.value; render(); });
  });
  ["etapa", "produto"].forEach(function (k) {
    $("f-" + k).addEventListener("change", function (e) { estado.filtro.pv[k] = e.target.value; render(); });
  });
  $("novo-cliente").addEventListener("click", function () { estado.novoCliente = true; render(); });
  // Vira o dia com a página aberta: recalcula o que vence hoje.
  setInterval(function () { if (estado.carregado.leads) render(); }, 10 * 60 * 1000);

  // ---------- banco ----------
  function iniciar(db) {
    if (!db) {
      estado.carregado = { leads: true, clientes: true };
      desligar("O banco da central não respondeu. Entre com a sua conta para ver a fila e marcar os envios.");
      return;
    }
    estado.db = db;
    estado.podeMarcar = true;
    $("conexao").className = "conexao on";
    $("conexao").textContent = "Ao vivo";
    function colecao(nome, chave) {
      db.collection(nome).onSnapshot(function (snap) {
        var novo = {};
        snap.docs.forEach(function (d) {
          if (!d.exists) return;
          var dados = Object.assign({}, d.data());
          dados.id = d.id;
          novo[d.id] = dados;
        });
        estado[chave] = novo;
        estado.carregado[chave] = true;
        render();
      }, function () {
        estado.carregado[chave] = true;
        desligar("A conexão com o banco caiu. Recarregue a página para tentar de novo.");
      });
    }
    colecao("leads", "leads");
    colecao("clientes", "clientes");
    db.doc("config/meta").onSnapshot(function (d) {
      if (d.exists) { estado.meta = Object.assign({}, estado.meta, d.data()); render(); }
    }, function () {});
    db.doc("config/fotos").onSnapshot(function (d) {
      estado.fotos = d.exists ? (d.data().fotos || null) : null;
      render();
    }, function () {});
    db.doc("config/posvenda").onSnapshot(function (d) {
      estado.pv = d.exists ? d.data() : null;
      render();
    }, function () {});
  }

  try {
    var salvo = location.hash === "#posvenda" ? "pv" : localStorage.getItem("central-funil");
    if (salvo === "pv" || salvo === "aq") estado.funil = salvo;
  } catch (e) { /* sem armazenamento: começa no aquecimento */ }
  render();
  var usar = window.claude && typeof window.claude.use === "function" ? window.claude.use("db") : Promise.resolve(null);
  Promise.resolve(usar).then(iniciar, function () { iniciar(null); });
  var usarDownloads = window.claude && typeof window.claude.use === "function" ? window.claude.use("downloads") : Promise.resolve(null);
  Promise.resolve(usarDownloads).then(function (d) { estado.downloads = d || null; render(); }, function () {});
})();
</script>
